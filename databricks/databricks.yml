bundle:
  name: olist-lakehouse

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.workspace_host}
    variables:
      catalog: olist_dev
  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
    variables:
      catalog: olist_prod

variables:
  workspace_host:
    description: Existing Databricks workspace URL. Keep auth in the CLI profile, not this file.
  catalog:
    description: Unity Catalog catalog created by the platform administrator.
