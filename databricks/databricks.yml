bundle:
  name: olist-lakehouse

include:
  - resources/*.yml

# Pipeline sources live beside the bundle directory. Include both roots in the
# sync boundary so job tasks can package those sources deterministically.
sync:
  paths:
    - .
    - ../pipelines

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: olist_dev
  prod:
    mode: production
    variables:
      catalog: olist_prod

variables:
  catalog:
    description: Unity Catalog catalog created by the platform administrator.
