resources:
  jobs:
    olist_batch_ingestion:
      name: olist-batch-ingestion
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_olist_files
          spark_python_task:
            # This resource file is nested under databricks/resources/.
            python_file: ../../pipelines/src/bronze/run_olist_batch.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
              - --source-path
              - "{{job.parameters.source_path}}"
              - --state-path
              - "{{job.parameters.state_path}}"
          # This workspace allows serverless jobs only. Python tasks need an
          # explicit execution environment when they do not use a cluster.
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: "2"
      parameters:
        - name: catalog
          default: olist_dev
        - name: source_path
          default: /Volumes/olist_dev/bronze/landing
        - name: state_path
          default: /Volumes/olist_dev/audit/pipeline_state
      tags:
        project: olist-lakehouse
        environment: ${bundle.target}
        cost-control: serverless-job-compute
    olist_silver_orders:
      name: olist-silver-orders
      max_concurrent_runs: 1
      tasks:
        - task_key: transform_orders
          spark_python_task:
            python_file: ../../pipelines/src/silver/run_orders_silver.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: "2"
      parameters:
        - name: catalog
          default: olist_dev
      tags:
        project: olist-lakehouse
        environment: ${bundle.target}
        cost-control: serverless-job-compute
    olist_gold_metrics:
      name: olist-gold-metrics
      max_concurrent_runs: 1
      tasks:
        - task_key: publish_customer_order_metrics
          spark_python_task:
            python_file: ../../pipelines/src/gold/run_order_metrics.py
            parameters:
              - --catalog
              - "{{job.parameters.catalog}}"
          environment_key: serverless_default
      environments:
        - environment_key: serverless_default
          spec:
            environment_version: "2"
      parameters:
        - name: catalog
          default: olist_dev
      tags:
        project: olist-lakehouse
        environment: ${bundle.target}
        cost-control: serverless-job-compute
