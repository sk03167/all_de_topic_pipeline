[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-lakehouse-lab"
version = "0.1.0"
description = "AWS and Databricks marketplace lakehouse learning lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.8.0",
]
generator = [
  "confluent-kafka>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["services/generator/tests", "pipelines/tests"]
pythonpath = ["services/generator/src", "pipelines/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["common", "bronze", "silver", "gold"]
